<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 70" width="100%" height="100%">
  <defs>
    <!-- Modern Gradient for 'Blog' -->
    <linearGradient id="blogGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>

    <!-- Accent Gradient for 'Sphere' -->
    <linearGradient id="sphereGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;800&amp;display=swap');

      .brand-text {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 52px;
      }

      .text-blog {
        font-weight: 800;
        fill: url(#blogGradient);
        letter-spacing: -1.5px;
      }

      .text-sphere {
        font-weight: 400;
        fill: url(#sphereGradient);
        letter-spacing: -1.5px;
      }
    </style>
  </defs>

  <!-- Only Text Component (No Icon, Transparent Background) -->
  <text x="10" y="52" class="brand-text">
    <tspan class="text-blog">Blog</tspan><tspan class="text-sphere">Sphere</tspan>
  </text>
</svg>
